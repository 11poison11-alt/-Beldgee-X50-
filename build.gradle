String getVersionName() {
    if (ext.has('cachedVersionName')) {
        return ext.cachedVersionName
    }

    def envVersion = System.getenv('VERSION_NAME')
    if (envVersion) {
        ext.cachedVersionName = envVersion
        return ext.cachedVersionName
    }

    def currentDefault = 'v3.2.0'
    def isAssembleTask = gradle.startParameter.taskNames.any {
        it.toLowerCase().contains('assemble') || it.toLowerCase().contains('bundle')
    }

    if (isAssembleTask && !java.awt.GraphicsEnvironment.isHeadless()) {
        def dialogHolder = new javax.swing.JDialog()
        dialogHolder.setAlwaysOnTop(true)
        def input = javax.swing.JOptionPane.showInputDialog(
                dialogHolder,
                "Текущая версия: ${currentDefault}\nВведите новую версию (формат vX.Y.Z) или нажмите ОК:",
                "Версия сборки APK",
                javax.swing.JOptionPane.QUESTION_MESSAGE,
                null,
                null,
                currentDefault
        )
        dialogHolder.dispose()
        if (input != null) {
            def clean = input.toString().trim()
            if (clean && clean != currentDefault) {
                if (!clean.startsWith('v')) {
                    clean = 'v' + clean
                }
                def rootGradleFile = file('build.gradle')
                def content = rootGradleFile.getText('UTF-8')
                content = content.replaceFirst(/def currentDefault = '[^']+'/, "def currentDefault = '${clean}'")
                rootGradleFile.write(content, 'UTF-8')
                currentDefault = clean
            }
        }
    }

    ext.cachedVersionName = currentDefault
    return ext.cachedVersionName
}



int getVersionCode() {
    def version = getVersionName()
    def (major, minor, patch) = version.replaceFirst('^v', '').replaceFirst('-\\w+$', '').tokenize('.').collect { it.toInteger() }

    return major * 10000 + minor * 100 + (patch ?: 0)
}

ext {
    appVersionName = getVersionName()
    appVersionCode = getVersionCode()

    println "Building version: ${appVersionName} (${appVersionCode})"
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath libs.gradle
        classpath libs.kotlin.gradle.plugin
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // Add dependency constraints for all projects
    configurations.configureEach {
        resolutionStrategy {
            // Force specific Kotlin versions
            force libs.kotlin.stdlib
            force libs.kotlin.stdlib.common
            force libs.kotlin.stdlib.jdk8

            // Fail on version conflict
            failOnVersionConflict()

            // Prefer modules that are part of this build (multi-project or composite build)
            preferProjectModules()
        }
    }
}